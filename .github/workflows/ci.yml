name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # The Nabto Edge Client C SDK is a binary XCFramework fetched over the network, so caching
      # keeps CI off a cold download on every run.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # Runner images rotate which simulators they ship, so resolve one rather than hardcoding it.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]

          def version(key):
              name = key.rsplit(".", 1)[-1]          # com.apple.CoreSimulator.SimRuntime.iOS-18-6
              if not name.startswith("iOS-"):
                  return None
              return tuple(int(part) for part in name.removeprefix("iOS-").split("-"))

          candidates = []
          for key, devices in runtimes.items():
              ios = version(key)
              if ios is None:
                  continue
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      candidates.append((ios, device["name"], device["udid"]))

          if not candidates:
              sys.exit("No iPhone simulator available on this runner")
          ios, name, udid = max(candidates)
          released = ".".join(map(str, ios))
          print(udid)
          print(f"Using {name} on iOS {released}", file=sys.stderr)
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild \
            -scheme NabtoEdgeThermostat \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            clean build test
